# FieldForms: `docker compose up` from a clean checkout gives a working app at http://localhost:8080
# with demo data. Every value has a development default; production MUST override the secrets
# through a .env file (see .env.example) — the defaults below are for local use only.
name: fieldforms

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgres://fieldforms_app:${APP_DB_PASSWORD:-dev-app-password}@postgres:5432/${POSTGRES_DB:-fieldforms}
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  TRUST_PROXY: ${TRUST_PROXY:-true}
  # Photos on a Docker volume by default. For S3-compatible storage set BLOB_STORE=s3 and the S3_* values.
  BLOB_STORE: ${BLOB_STORE:-local}
  BLOB_LOCAL_DIR: /data/blobs
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-af-south-1}
  S3_BUCKET: ${S3_BUCKET:-fieldforms}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  OIDC_PROVIDERS: ${OIDC_PROVIDERS:-}
  OIDC_MICROSOFT_ISSUER: ${OIDC_MICROSOFT_ISSUER:-}
  OIDC_MICROSOFT_CLIENT_ID: ${OIDC_MICROSOFT_CLIENT_ID:-}
  OIDC_MICROSOFT_CLIENT_SECRET: ${OIDC_MICROSOFT_CLIENT_SECRET:-}
  OIDC_MICROSOFT_LABEL: Microsoft 365
  OIDC_GOOGLE_ISSUER: ${OIDC_GOOGLE_ISSUER:-}
  OIDC_GOOGLE_CLIENT_ID: ${OIDC_GOOGLE_CLIENT_ID:-}
  OIDC_GOOGLE_CLIENT_SECRET: ${OIDC_GOOGLE_CLIENT_SECRET:-}
  OIDC_GOOGLE_LABEL: Google Workspace
  # Phase 3: documents and destinations.
  GOTENBERG_URL: http://gotenberg:3000
  GOTENBERG_USERNAME: ${GOTENBERG_USERNAME:-fieldforms}
  GOTENBERG_PASSWORD: ${GOTENBERG_PASSWORD:-dev-gotenberg-password}
  # Private ranges destinations may reach (e.g. an on-premises SFTP server). Empty: public only.
  DESTINATIONS_ALLOWED_PRIVATE_CIDRS: ${DESTINATIONS_ALLOWED_PRIVATE_CIDRS:-}
  DESTINATIONS_ALLOW_SAME_NETWORK: ${DESTINATIONS_ALLOW_SAME_NETWORK:-false}
  API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-120}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fieldforms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-fieldforms}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ['127.0.0.1:5432:5432']
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fieldforms} -d ${POSTGRES_DB:-fieldforms}']
      interval: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    # The web inbox, and SMTP for a worker or tests run outside Docker.
    ports: ['127.0.0.1:8025:8025', '127.0.0.1:1025:1025']

  # HTML and Word → PDF. On an internal network with no route out, behind basic auth, with
  # JavaScript off and Chromium refused every network address: a template cannot make it fetch
  # anything (ARCHITECTURE.md, "Renderer isolation").
  gotenberg:
    image: gotenberg/gotenberg:8
    command:
      - gotenberg
      - --api-enable-basic-auth
      - --api-disable-download-from
      - --webhook-disable
      - --chromium-disable-javascript=true
      - --chromium-deny-private-ips=true
      - --chromium-deny-public-ips=true
      - --libreoffice-deny-private-ips=true
      - --libreoffice-deny-public-ips=true
    environment:
      GOTENBERG_API_BASIC_AUTH_USERNAME: ${GOTENBERG_USERNAME:-fieldforms}
      GOTENBERG_API_BASIC_AUTH_PASSWORD: ${GOTENBERG_PASSWORD:-dev-gotenberg-password}
    networks: [render]

  # One-shot: applies migrations as the database owner and sets the app role's password.
  migrate:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    image: fieldforms-api
    pull_policy: build
    command: ['node', 'dist/migrate.js']
    healthcheck: { disable: true }
    environment:
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER:-fieldforms}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-fieldforms}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-dev-app-password}
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  # One-shot: loads demo data into an empty database. Does nothing if data exists, or if
  # SEED_DEMO_DATA is not "true" (set it to false in production).
  seed:
    image: fieldforms-api
    pull_policy: never # built by the migrate service
    command:
      [
        'sh',
        '-c',
        'if [ "$${SEED_DEMO_DATA}" = "true" ]; then node dist/seed.js; else echo "seed skipped"; fi',
      ]
    healthcheck: { disable: true }
    environment:
      <<: *api-env
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    volumes: [blobs:/data/blobs]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: 'no'

  api:
    image: fieldforms-api
    pull_policy: never # built by the migrate service
    environment:
      <<: *api-env
      # Seals destination secrets; the API can never open them. Development key pair only: run
      # `pnpm secrets-keygen` for production and give the private key to the worker alone.
      SECRETS_PUBLIC_KEY: ${SECRETS_PUBLIC_KEY:-MCowBQYDK2VuAyEA4YBdTjibsqoLUzl8VjCGa7Bp7xXcg/Y/xoBVwqH7N2A=}
    networks: [default, render]
    volumes: [blobs:/data/blobs]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  worker:
    image: fieldforms-api
    pull_policy: never # built by the migrate service
    command: ['node', 'dist/worker.js']
    # The image's health check probes the HTTP API, which the worker does not serve.
    healthcheck: { disable: true }
    environment:
      <<: *api-env
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-FieldForms <fieldforms@localhost>}
      # Mailpit has no STARTTLS; production mail servers must (the default is true).
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-false}
      SECRETS_PRIVATE_KEY: ${SECRETS_PRIVATE_KEY:-MC4CAQAwBQYDK2VuBCIEIGi69oAqtkd6OJ3NfwFp/UOR/GPrbBV7P+pAj3p1gqN5}
      SECRETS_PRIVATE_KEY_PREVIOUS: ${SECRETS_PRIVATE_KEY_PREVIOUS:-}
      DELIVERY_CONCURRENCY: ${DELIVERY_CONCURRENCY:-4}
      EMAIL_ATTACHMENT_LIMIT_MB: ${EMAIL_ATTACHMENT_LIMIT_MB:-10}
    networks: [default, render]
    volumes: [blobs:/data/blobs]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
    # Longer than the worker's graceful stop (20 s), so a deploy does not kill jobs mid-send.
    stop_grace_period: 30s

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    image: fieldforms-web
    pull_policy: build
    ports: ['${WEB_PORT:-8080}:8080']
    depends_on: [api]
    restart: unless-stopped

networks:
  default:
  # Only the API and the worker reach Gotenberg; it reaches nothing.
  render:
    internal: true

volumes:
  pgdata:
  blobs:

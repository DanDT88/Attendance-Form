# Serves the PWA and proxies /api to the API container. Put TLS in front of this in production
# (a reverse proxy or load balancer), and set COOKIE_SECURE=true and TRUST_PROXY=true on the API.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 6m;

  # Re-resolve the API's address (Docker's DNS) so a restarted API container, which may get a new
  # IP, is found again. A literal host in proxy_pass would be resolved once, at nginx start-up.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:3000;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # The service worker, the HTML and the manifest must always be revalidated, or phones keep
  # running an old version of the app.
  location = /sw.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    default_type application/manifest+json;
    try_files $uri =404;
  }

  # Hashed build assets never change, so they can be cached for a year.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
